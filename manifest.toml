#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "hister"
name = "Nogon"
description.en = "Your own search engine"
description.fr = "Votre propre moteur de recherche"

version = "0.22.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "AGPL-3.0"
website = "https://nogon.eu/"
demo = "https://demo.nogon.eu/"
admindoc = "https://nogon.eu/docs/quickstart"
code = "https://github.com/asciimoo/nogon"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "nogon"
    in_subdir = false
    amd64.url = "https://github.com/asciimoo/nogon/releases/download/v0.22.0/nogon_0.22.0_linux_amd64"
    amd64.sha256 = "e358b54b5e80e144e63ae600584953cbdaa52096812c896d94ac91078e7aad41"
    arm64.url = "https://github.com/asciimoo/nogon/releases/download/v0.22.0/nogon_0.22.0_linux_arm64"
    arm64.sha256 = "31e2e4fd8dd36844cb7817e272fc6ff7a62cf324cc1de00e986813b459e1f8b7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^nogon_.*_linux_amd64$"
    autoupdate.asset.arm64 = "^nogon_.*_linux_arm64$"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
