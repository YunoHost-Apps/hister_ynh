app:
  directory: '__INSTALL_DIR__/hister'
  title: 'Hister'
  subtitle: 'Your own search engine'
  search_url: 'https://google.com/search?q={query}'
  public: false
  log_level: 'info'
  log_format: 'text'
  log_file: ''
  open_results_on_new_tab: false

server:
  address: '127.0.0.1:__PORT__'
  base_url: 'http://__DOMAIN__'
  database: 'db.sqlite3'

indexer:
  detect_languages: true
  keep_stopwords: false
  directories:
    - path: '~/notes'
      filetypes: ['txt', 'md']

crawler:
  backend: 'http'
  proxy: 'http://127.0.0.1:8080'
  timeout: 5
  delay: 1
  user_agent: 'Hister'

semantic_search:
  enable: false
  embedding_endpoint: 'http://localhost:11434/v1/embeddings'
  embedding_model: 'qwen3-embedding:8b'
  embedding_timeout: 300
  dimensions: 4096
  max_context_length: 512
  chunk_overlap: 64
  max_embedding_batch_size: 8
  similarity_threshold: 0.1
  result_limit: 50
  semantic_weight: 0.4
  max_embedding_concurrency: 2

hotkeys:
  web:
    '/': 'focus_search_input'
    'enter': 'open_result'
    'alt+enter': 'open_result_in_new_tab'
    'alt+j': 'select_next_result'
    'alt+k': 'select_previous_result'
    'alt+o': 'open_query_in_search_engine'
    'alt+v': 'view_result_popup'
    'tab': 'autocomplete'
    '?': 'show_hotkeys'

sensitive_content_patterns:
  aws_access_key: '(^|[s"''])AKIA[0-9A-Z]{16}([s"'']|$)'
  github_token: '(ghp|gho|ghu|ghs|ghr)_[a-zA-Z0-9]{36}'